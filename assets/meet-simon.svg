<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Meet Simon</title>
  <desc id="desc">A comic illustration of Simon, a short-haired office worker with a small mustache, pulling his hair while repeatedly explaining the same project to Codex.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.18"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#111827" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" rx="32" fill="#f7f3e8"/>
  <rect width="1200" height="630" rx="32" fill="url(#dots)"/>
  <path d="M0 510 C230 450 400 590 650 520 C860 462 1000 480 1200 430 L1200 630 L0 630 Z" fill="#dbeafe"/>

  <text x="70" y="88" font-family="ui-rounded, system-ui, sans-serif" font-size="58" font-weight="800" fill="#111827">MEET SIMON</text>
  <text x="73" y="130" font-family="system-ui, sans-serif" font-size="25" font-weight="600" fill="#475569">He has explained this project before.</text>

  <!-- repeated speech bubbles -->
  <g filter="url(#shadow)" font-family="system-ui, sans-serif">
    <path d="M655 62 h385 a24 24 0 0 1 24 24 v72 a24 24 0 0 1-24 24 H827 l-40 40 8-40 H655 a24 24 0 0 1-24-24 V86 a24 24 0 0 1 24-24Z" fill="#ffffff" stroke="#111827" stroke-width="4"/>
    <text x="676" y="106" font-size="22" font-weight="700" fill="#111827">“Let me explain the project again…”</text>
    <text x="676" y="142" font-size="18" fill="#475569">Same client. Same constraints. Same task.</text>

    <path d="M746 232 h345 a20 20 0 0 1 20 20 v54 a20 20 0 0 1-20 20 H876 l-29 30 6-30 H746 a20 20 0 0 1-20-20 v-54 a20 20 0 0 1 20-20Z" fill="#ffffff" stroke="#111827" stroke-width="3" opacity="0.92"/>
    <text x="769" y="278" font-size="20" font-weight="650" fill="#111827">“No, still not a five-page answer.”</text>
  </g>

  <!-- desk -->
  <rect x="525" y="461" width="605" height="35" rx="12" fill="#8b5e3c" stroke="#111827" stroke-width="4"/>
  <rect x="590" y="494" width="28" height="103" rx="8" fill="#6b442b"/>
  <rect x="1040" y="494" width="28" height="103" rx="8" fill="#6b442b"/>

  <!-- laptop -->
  <g filter="url(#shadow)">
    <rect x="783" y="348" width="265" height="145" rx="15" fill="#334155" stroke="#111827" stroke-width="5"/>
    <rect x="802" y="367" width="227" height="105" rx="8" fill="#dbeafe"/>
    <text x="915" y="415" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="800" fill="#111827">CODEX</text>
    <text x="915" y="447" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#475569">What project?</text>
    <path d="M750 493 h330 l-28 25 H777 Z" fill="#64748b" stroke="#111827" stroke-width="4"/>
  </g>

  <!-- Simon body -->
  <g stroke="#111827" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M295 390 C245 407 218 452 216 526 L493 526 C492 452 465 408 414 390 Z" fill="#e2e8f0"/>
    <path d="M338 392 l-24 80 42 42 42-42-24-80 Z" fill="#ffffff"/>
    <path d="M356 415 l-17 74 17 25 17-25-17-74 Z" fill="#ef4444"/>
    <path d="M216 526 h277"/>

    <!-- neck -->
    <path d="M325 352 v55 h62 v-55" fill="#d6a77a"/>

    <!-- head -->
    <ellipse cx="356" cy="291" rx="100" ry="111" fill="#d6a77a"/>
    <path d="M263 278 C255 190 307 162 358 164 C425 164 460 206 449 280 C426 247 392 224 340 224 C306 224 280 246 263 278Z" fill="#111827"/>
    <path d="M275 221 q20-38 54-42 M321 181 q25-25 58-10 M379 174 q32 4 51 36" fill="none"/>

    <!-- ears -->
    <ellipse cx="258" cy="300" rx="20" ry="31" fill="#d6a77a"/>
    <ellipse cx="454" cy="300" rx="20" ry="31" fill="#d6a77a"/>

    <!-- face -->
    <path d="M308 286 q18-13 37 0" fill="none"/>
    <path d="M369 286 q18-13 37 0" fill="none"/>
    <circle cx="329" cy="293" r="5" fill="#111827" stroke="none"/>
    <circle cx="390" cy="293" r="5" fill="#111827" stroke="none"/>
    <path d="M357 299 l-7 27 14 0" fill="none"/>
    <path d="M331 342 q25-24 50 0 q-25 14-50 0Z" fill="#111827"/>
    <path d="M334 365 q22 13 44 0" fill="none"/>

    <!-- arms pulling hair -->
    <path d="M292 423 C238 404 214 352 233 293" fill="none" stroke="#d6a77a" stroke-width="28"/>
    <path d="M420 423 C477 401 497 350 479 291" fill="none" stroke="#d6a77a" stroke-width="28"/>
    <path d="M228 298 q-12-45 20-69 q20-14 29 8 l-6 55" fill="#d6a77a"/>
    <path d="M484 298 q12-45-20-69 q-20-14-29 8 l6 55" fill="#d6a77a"/>
    <path d="M242 238 l15-30 M254 244 l28-26 M470 238 l-15-30 M458 244 l-28-26" fill="none"/>
  </g>

  <!-- stress marks -->
  <g stroke="#ef4444" stroke-width="8" stroke-linecap="round">
    <path d="M188 198 l-28-25"/>
    <path d="M205 174 l-10-36"/>
    <path d="M520 198 l28-25"/>
    <path d="M504 174 l10-36"/>
  </g>

  <rect x="690" y="544" width="405" height="54" rx="27" fill="#111827"/>
  <text x="892" y="579" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="750" fill="#ffffff">Then Simon gave Codex a memory.</text>
</svg>
